# 产出未签名 IPA：给 Sideloadly / SideStore 侧载用。
name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Inspect toolchain
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcodebuild -showsdks | head -20

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Verify project
        run: xcodebuild -list -project KuXuan.xcodeproj

      - name: Archive without signing
        run: |
          xcodebuild archive \
            -project KuXuan.xcodeproj \
            -scheme KuXuan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/KuXuan.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build/archive.log

      - name: Show compile errors
        if: always()
        run: |
          echo "===== error 行 ====="
          grep -nE "error:|error generated|BUILD FAILED|ARCHIVE FAILED" build/archive.log | head -80 || true

      - name: Pack unsigned IPA
        if: always()
        run: |
          APP="$PWD/build/KuXuan.xcarchive/Products/Applications/KuXuan.app"
          if [ -d "$APP" ]; then
            mkdir -p "$PWD/build/Payload"
            cp -R "$APP" "$PWD/build/Payload/"
            cd "$PWD/build"
            zip -qry KuXuan-unsigned.ipa Payload
            ls -lh KuXuan-unsigned.ipa
            unzip -l KuXuan-unsigned.ipa | head -12
          else
            echo "::warning::未找到编译产物 KuXuan.app（编译可能失败，见 archive 日志）"
          fi

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KuXuan-unsigned-IPA
          path: build/KuXuan-unsigned.ipa
          retention-days: 30
          if-no-files-found: warn
