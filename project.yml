# XcodeGen 配置：CI 里执行 `xcodegen generate` 生成 KuXuan.xcodeproj
# 纯 SwiftUI 工程（无 WKWebView、无 Web 资源）。本机无 Xcode，编译在 GitHub Actions 完成。
name: KuXuan

options:
  bundleIdPrefix: com.markruan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  KuXuan:
    type: application
    platform: iOS
    sources:
      - path: KuXuan/App.swift
      - path: KuXuan/Theme.swift
      - path: KuXuan/Models.swift
      - path: KuXuan/API.swift
      - path: KuXuan/ImageColor.swift
      - path: KuXuan/PlayerEngine.swift
      - path: KuXuan/AuthStore.swift
      - path: KuXuan/AccountViews.swift
      - path: KuXuan/CommentView.swift
      - path: KuXuan/HomeView.swift
      - path: KuXuan/PlaylistView.swift
      - path: KuXuan/FullPlayer.swift
      - path: KuXuan/QueueSheet.swift
      - path: KuXuan/MiniPlayer.swift
      - path: KuXuan/SettingsView.swift
      # App 图标：不用 Assets.xcassets（本机 Xcode 缺 iOS 17.2 模拟器运行时，
      # actool 编译单张 1024 通用图标会报 Failed to locate any simulator runtime）。
      # 改为各尺寸 PNG 直接进 bundle，由 Info.plist 的 CFBundleIconFiles 声明。
      - path: KuXuan/Icon-60@2x.png
      - path: KuXuan/Icon-60@3x.png
      - path: KuXuan/Icon-76@2x.png
      - path: KuXuan/Icon-83.5@2x.png
      - path: KuXuan/Icon-Small@2x.png
      - path: KuXuan/Icon-Small@3x.png
      - path: KuXuan/Icon-Spotlight-40@2x.png
      - path: KuXuan/Icon-Spotlight-40@3x.png
      - path: KuXuan/Icon-Notification-20@2x.png
      - path: KuXuan/Icon-Notification-20@3x.png
    info:
      path: KuXuan/Info.plist
      # 必须显式写在这里：xcodegen generate 会用下面的内容覆写 KuXuan/Info.plist，
      # 否则每次生成都会被重置成空壳，UIBackgroundModes / ATS 永远进不了包。
      properties:
        CFBundleDisplayName: KuXuan
        LSRequiresIPhoneOS: true
        MinimumOSVersion: "16.0"
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: 保存网易云登录二维码到相册，便于用网易云 App 从相册扫码登录
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # 关键：没有 Launch Screen 声明时 iOS 会退回 320x480 兼容模式，
        # 再等比放大填满屏宽 → 上下各约 15.4% 黑边、右侧内容被裁、底部控件被挤出。
        # UIColorName 空串是 Xcode 官方模板写法，不要删。
        UILaunchScreen:
          UIColorName: ""
        # GENERATE_INFOPLIST_FILE=NO 时 Xcode 不会自动注入 CFBundleIcons，必须显式声明。
        # 名字写基准名，iOS 按设备倍数自动取 @2x / @3x 文件。
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - Icon-60
              - Icon-Spotlight-40
              - Icon-Small
              - Icon-Notification-20
            UIPrerenderedIcon: true
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - Icon-76
              - Icon-83.5
              - Icon-Spotlight-40
              - Icon-Small
              - Icon-Notification-20
            UIPrerenderedIcon: true
    settings:
      base:
        # 关键：关闭 Xcode 自动生成 Info.plist，否则 KuXuan/Info.plist 会被完全忽略，
        # UIBackgroundModes(audio) / NSAppTransportSecurity 不会进包，导致锁屏停播。
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.markkuxuan.kuxuan
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
